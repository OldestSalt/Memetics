services:
  telegram-bot:
    container_name: telegram-bot
    build: bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DEV=${DEV}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - IMG_BUCKET_NAME=${IMG_BUCKET_NAME}
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - minio

  db_manager:
    container_name: db_manager
    build: db_manager
    environment:
      - DEV=${DEV}
      - POSTGRES_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${POSTGRES_PORT}/images
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq

  minio:
    image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        minio server --address "0.0.0.0:9000" --console-address "0.0.0.0:9001" /data
    volumes:
      - .minio:/data
    healthcheck:
      start_period: 3m
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: 20s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    image: "rabbitmq:4.2"
    container_name: rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_CONSOLE_PORT}:8080"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  postgres:
    image: "postgres:18"
    container_name: postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - .postgres:/var/lib/postgresql/18/docker
    healthcheck:
      start_period: 3m
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3m
      timeout: 30s
      retries: 1

  embedder:
    container_name: embedder
    build: embedder
    environment:
      - DEV=${DEV}
      - WEAVIATE_PORT=${WEAVIATE_PORT}
      - WEAVIATE_GRPC_PORT=${WEAVIATE_GRPC_PORT}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - COLLECTION_NAME=${COLLECTION_NAME}
    restart: unless-stopped
    depends_on:
      - weaviate
      - minio
      - rabbitmq
      - vllm

  weaviate:
    image: "semitechnologies/weaviate:1.35.3"
    container_name: weaviate
    command:
      - --host
      - 0.0.0.0
      - --port
      - '${WEAVIATE_PORT}'
      - --scheme
      - http
    volumes:
      - .weaviate:/var/lib/weaviate
    environment:
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - CLUSTER_HOSTNAME=node1
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:nightly
    container_name: vllm
    runtime: nvidia
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - .models:/models
    ipc: host
    command: >
      --model Qwen/Qwen3-VL-Embedding-2B
      --host 0.0.0.0
      --port ${VLLM_PORT}
      --gpu-memory-utilization 0.8
      --max-model-len 4096
      --runner pooling
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${VLLM_PORT}/health" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: 20s
      retries: 3
      start_period: 3m

volumes:
  .postgres:
  .minio:
  .weaviate:
  .models:
