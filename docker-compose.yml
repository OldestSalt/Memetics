version: "0.1.0"
services:
  telegram-bot:
    container_name: telegram-bot
    build: bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DEV=${DEV}
      - MINIO_PORT=${MINIO_PORT}
      - POSTGRES_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:${POSTGRES_PORT}/images
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

  minio:
    image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        minio server --address "0.0.0.0:9000" --console-address "0.0.0.0:9001" /data
    volumes:
      - ./.minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: 20s
      retries: 3
      start_interval: 1m
    restart: unless-stopped

  rabbitmq:
    image: "rabbitmq:4.2"
    container_name: rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_CONSOLE_PORT}:8080"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  postgres:
    image: "postgres:17.4"
    container_name: postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - ./.postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME"]
      interval: 3m
      timeout: 30s
      retries: 1
      start_interval: 1m

  embedder:
    container_name: embedder
    build: embedder

  weaviate:
    image: "semitechnologies/weaviate:1.35"
    container_name: weaviate


