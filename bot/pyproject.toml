[project]
name = "bot"
version = "0.1.0"
description = "Telegram bot for collecting memes from the channel"
authors = [
    {name = "OldestSalt",email = "personal@oldestsalt.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot (>=22.5,<23.0)",
    "minio (>=7.2.20,<8.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "pika (>=1.3.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
